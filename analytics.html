<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التحليلات المتقدمة | Prime Estate</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Cairo', 'sans-serif'], en: ['Plus Jakarta Sans', 'sans-serif'] } } } };
    </script>
    <style> body { font-family: 'Cairo', sans-serif !important; } .font-en { font-family: 'Plus Jakarta Sans', sans-serif !important; } </style>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="flex h-screen w-full antialiased selection:bg-zinc-300 dark:selection:bg-zinc-700 bg-[var(--bg-main)] transition-colors overflow-hidden">
    
    <!-- Mobile Overlay -->
    <div id="mobile-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-40 hidden lg:hidden backdrop-blur-sm transition-opacity opacity-0"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="w-64 h-full glass-panel border-l border-[var(--border-color)] flex flex-col z-50 flex-shrink-0 transition-transform duration-300 fixed lg:relative right-0 translate-x-full lg:translate-x-0 bg-[var(--bg-main)]">
        <div class="h-20 flex items-center px-6 border-b border-[var(--border-color)] stagger-1">
            <div class="w-10 h-10 bg-[var(--text-primary)] rounded-xl flex items-center justify-center shadow-lg anim-pulse-ring">
                <i data-lucide="building-2" class="w-6 h-6 text-[var(--bg-main)]"></i>
            </div>
            <span class="mr-4 font-bold text-xl tracking-tight text-[var(--text-primary)] font-en">Prime Estate</span>
        </div>
        
        <nav class="flex-1 py-8 px-4 overflow-y-auto space-y-2 stagger-2">
            <p class="px-4 text-xs font-bold text-[var(--text-secondary)] uppercase tracking-wider mb-2">القائمة الرئيسية</p>
            
            <a href="index.html" class="nav-link flex items-center px-4 py-3 rounded-xl text-[var(--text-secondary)] hover:bg-[var(--hover-bg)] hover:text-[var(--text-primary)] group">
                <i data-lucide="layout-dashboard" class="w-5 h-5 group-hover:scale-110 transition-transform"></i>
                <span class="mr-4 text-sm font-semibold">نظرة عامة</span>
            </a>
            <a href="analytics.html" class="nav-link active flex items-center px-4 py-3 rounded-xl text-[var(--text-primary)] group">
                <i data-lucide="pie-chart" class="w-5 h-5 group-hover:scale-110 transition-transform"></i>
                <span class="mr-4 text-sm font-semibold">التحليلات المتقدمة</span>
            </a>
            <a href="customers.html" class="nav-link flex items-center px-4 py-3 rounded-xl text-[var(--text-secondary)] hover:bg-[var(--hover-bg)] hover:text-[var(--text-primary)] group">
                <i data-lucide="users" class="w-5 h-5 group-hover:scale-110 transition-transform"></i>
                <span class="mr-4 text-sm font-semibold">العملاء</span>
                <span class="mr-auto bg-[var(--text-primary)] text-[var(--bg-main)] py-0.5 px-2 rounded-full text-[10px] font-bold font-en">NEW</span>
            </a>
            <a href="settings.html" class="nav-link flex items-center px-4 py-3 rounded-xl text-[var(--text-secondary)] hover:bg-[var(--hover-bg)] hover:text-[var(--text-primary)] group">
                <i data-lucide="settings" class="w-5 h-5 group-hover:scale-110 transition-transform"></i>
                <span class="mr-4 text-sm font-semibold">الإعدادات</span>
            </a>
        </nav>

        <div class="p-6 border-t border-[var(--border-color)] stagger-3">
            <div class="flex items-center gap-3">
                <img src="https://ui-avatars.com/api/?name=Nancy+Ahmed&background=000&color=fff&rounded=true" class="w-10 h-10 rounded-full object-cover border-2 border-[var(--border-color)] group-hover:scale-105 transition-transform" alt="نانسي">
                <div>
                    <h4 class="text-sm font-bold text-[var(--text-primary)]">نانسي أحمد</h4>
                    <p class="text-xs text-[var(--text-secondary)]">المدير العام</p>
                </div>
            </div>
        </div>
    </aside>

    <div class="flex-1 flex flex-col relative w-full h-full bg-[var(--bg-main)] transition-colors overflow-hidden">
        
        <header class="h-20 glass-panel flex items-center justify-between px-8 z-10 sticky top-0 stagger-1">
            <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" class="lg:hidden px-4 h-10 rounded-xl flex items-center justify-center gap-2 bg-[var(--bg-surface)] border border-[var(--border-color)] text-[var(--text-primary)] hover:bg-[var(--hover-bg)] transition-all shadow-md">
                    <i data-lucide="menu" class="w-5 h-5"></i>
                    <span class="text-sm font-bold">القائمة</span>
                </button>
                <div class="relative w-96 hidden lg:block group">
                    <i data-lucide="search" class="absolute right-4 top-1/2 -translate-y-1/2 w-4 h-4 text-[var(--text-secondary)] group-hover:text-[var(--accent)] transition-colors"></i>
                    <input type="text" placeholder="البحث في التحليلات..." class="w-full bg-[var(--bg-surface)] border border-[var(--border-color)] rounded-full pr-12 pl-4 py-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-[var(--accent)] transition-all text-[var(--text-primary)] placeholder-[var(--text-secondary)] shadow-sm focus:shadow-md">
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <button onclick="toggleTheme()" class="w-10 h-10 rounded-full flex items-center justify-center bg-[var(--bg-surface)] border border-[var(--border-color)] text-[var(--text-primary)] hover:bg-[var(--hover-bg)] transition-all hover:-translate-y-1">
                    <div class="pointer-events-none">
                        <i data-lucide="moon" class="w-4 h-4 hidden dark:block"></i>
                        <i data-lucide="sun" class="w-4 h-4 block dark:hidden"></i>
                    </div>
                </button>
                <button class="w-10 h-10 rounded-full flex items-center justify-center bg-[var(--bg-surface)] border border-[var(--border-color)] text-[var(--text-primary)] hover:bg-[var(--hover-bg)] transition-all relative hover:-translate-y-1">
                    <i data-lucide="bell" class="w-4 h-4"></i>
                </button>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto w-full p-8 relative">
            <div class="absolute top-0 right-0 w-[500px] h-[500px] bg-gradient-to-br from-zinc-500/10 to-transparent dark:from-zinc-500/10 rounded-full blur-[100px] pointer-events-none -z-10 anim-pulse-ring"></div>
            
            <div class="page-content active" style="opacity: 1; animation: none;">
                <div class="flex justify-between items-end mb-8 stagger-1">
                    <div>
                        <h1 class="text-3xl font-bold text-[var(--text-primary)]">التحليلات المتقدمة</h1>
                        <p class="text-sm text-[var(--text-secondary)] mt-1 font-medium">تحليل ذكي لبيانات مبيعات العقارات بالتفصيل.</p>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
                    <div class="premium-card p-6 h-[400px] flex flex-col stagger-2">
                        <div class="mb-4">
                            <h2 class="text-lg font-bold text-[var(--text-primary)]">توزيع العقود العقارية المكتملة</h2>
                            <p class="text-xs text-[var(--text-secondary)] mt-1">نسب المشاريع الأعلى طلباً</p>
                        </div>
                        <div class="flex-1 relative w-full flex items-center justify-center">
                            <canvas id="categoryPie"></canvas>
                        </div>
                    </div>

                    <div class="premium-card p-6 h-[400px] flex flex-col stagger-3">
                        <div class="mb-4">
                            <h2 class="text-lg font-bold text-[var(--text-primary)]">أرباح المبيعات مقابل الإيجارات</h2>
                        </div>
                        <div class="flex-1 relative w-full">
                            <canvas id="monthlyBar"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js?v=2"></script>
</body>
</html>
